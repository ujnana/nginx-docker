version: '3.8'

services:
  # PHP Service
  php:
    build:
      context: ./php
      args:
        PHP_VERSION: ${PHP_VERSION:-8.1}
    volumes:
      - ./app:/var/www/html
      - ./php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    environment:
      - WORDPRESS_DB_HOST=db
      - WORDPRESS_DB_USER=${DB_USER}
      - WORDPRESS_DB_PASSWORD=${DB_PASSWORD}
      - WORDPRESS_DB_NAME=${DB_NAME}
    dns:
      - 8.8.8.8
      - 8.8.4.4
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - bridge_default

  # Nginx Service
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./app:/var/www/html
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    dns:
      - 8.8.8.8
      - 8.8.4.4
    depends_on:
      - php
    environment:
      - DOMAIN=${DOMAIN:-example.com}
    networks:
      - bridge_default

  # Certbot Service
  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - bridge_default

  # Database Service
  db:
    image: mariadb:10.6
    command: '--default-authentication-plugin=mysql_native_password'
    volumes:
      - db_data:/var/lib/mysql
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - MYSQL_DATABASE=${DB_NAME}
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_PASSWORD}
    networks:
      - bridge_default

  # phpMyAdmin Service
  phpmyadmin:
    image: phpmyadmin:latest
    # ports:
    #   - "${PMA_PORT:-8081}:80"
    environment:
      - PMA_HOST=db
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
    depends_on:
      - db
    networks:
      - bridge_default

  # Redis Service
  redis:
    image: redis:alpine
    restart: always
    networks:
      - bridge_default

networks:
  bridge_default:
    external: true
    name: bridge_default

volumes:
  db_data:
  certbot_conf:
  certbot_www:
